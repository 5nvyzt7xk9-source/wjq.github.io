<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>给你的小心心 ❤️</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }
    .heart {
        position: absolute;
        color: red;
        font-size: 20px;
        animation: float 6s linear infinite;
    }
    @keyframes float {
        0% {
            transform: translateY(100vh) scale(0.5);
            opacity: 1;
        }
        100% {
            transform: translateY(-10vh) scale(1.5);
            opacity: 0;
        }
    }
    .text {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        color: pink;
        font-size: 30px;
        font-weight: bold;
        text-shadow: 0 0 10px red;
    }
</style>
</head>
<body>

<div class="text">金小玲我喜欢你 ❤️</div>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 100);
</script>

</body>
</html>
